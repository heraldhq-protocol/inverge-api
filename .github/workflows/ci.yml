name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Only used by `prisma generate`; no database is reachable in this job and
      # no query is executed.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test -- --ci --forceExit

      - name: Build
        run: pnpm build

      # Fails when a controller or DTO changed without regenerating the committed
      # contract. This is the drift gate: the web client is generated from it.
      - name: OpenAPI drift
        run: pnpm openapi:check
